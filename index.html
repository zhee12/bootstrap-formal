<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Praditya</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e3a5f);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .biodata-card {
            max-width: 400px;
            width: 100%;
            border-radius: 15px;
        }

        .judul {
            color: #1e3a5f;
            font-weight: bold;
        }

        .label {
            color: #6c757d;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container px-4">
        <div class="card biodata-card shadow-lg border-0 mx-auto">
            <div class="card-body p-4">

                <div class="text-center mb-4">
                    <h3 class="judul">BIODATA MAHASISWA</h3>
                    <p class="text-muted mb-0">Data Diri</p>
                </div>

                <div class="mb-3">
                    <div class="label">Nama</div>
                    <div class="fw-semibold">
                        Praditya Puji Hanggoro
                    </div>
                </div>

                <div class="mb-3">
                    <div class="label">Kelas</div>
                    <div class="fw-semibold">
                        Komputerisasi Akuntansi
                    </div>
                </div>

                <div class="mb-3">
                    <div class="label">Semester</div>
                    <div class="fw-semibold">
                        Semester 1
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
